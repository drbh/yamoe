name: Run basic

# Runs basic.py on an HF Jobs GPU: loads gpt-oss-20b, swaps its MoE for the
# yamoe kernel (pulled from drbh/yamoe@main), and prints the logits.
# Run "Build Kernel" first so the Hub has a fresh kernel to pull.

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run basic.py on an HF Jobs GPU
        uses: huggingface/hf-jobs-action@main
        with:
          token: ${{ secrets.HF_TOKEN }}
          namespace: drbh
          flavor: h200
          image: ghcr.io/astral-sh/uv:python3.10-bookworm
          timeout: "3600"
          files: basic.py
          script: |
            set +x
            export HF_TOKEN="${{ secrets.HF_TOKEN }}"
            uv run /tmp/files/basic.py
