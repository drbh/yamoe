[general]
name = "yamoe"
backends = ["cuda"]

[torch]
src = [
    "torch-ext/torch_binding.cpp",
    "torch-ext/torch_binding.h",
]

[kernel.yamoe]
backend = "cuda"
cuda-capabilities = [
    "8.6",
    "8.7",
    "8.9",
    "9.0",
]
depends = [
    "torch",
    "cutlass_3_8",
]
src = [
    "csrc/index_select.cu",
    "csrc/gather.cu",
    "csrc/scatter.cu",
    "csrc/sort.cu",
    "csrc/bincount_cumsum.cu",
    "csrc/batch_mm.cu",
    "csrc/glu.cu",
    "csrc/moe.cpp",
    "csrc/experts_backward.cu",
]
