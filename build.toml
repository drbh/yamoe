[general]
name = "yamoe"
version = 2
edition = 6
license = "MIT"
backends = [
    "cuda",
    "rocm",
]

[general.hub]
repo-id = "drbh/yamoe"

[torch]
src = [
    "torch-ext/torch_binding.cpp",
    "torch-ext/torch_binding.h",
]

[kernel.yamoe]
language = "cpp-cuda"
cuda-capabilities = [
    "8.0",
    "8.6",
    "8.7",
    "8.9",
    "9.0",
    "10.0",
    "12.0",
]
depends = [
    "torch",
    "cutlass_3_8",
]
src = [
    "csrc/index_select.cu",
    "csrc/gather.cu",
    "csrc/scatter.cu",
    "csrc/sort.cu",
    "csrc/bincount_cumsum.cu",
    "csrc/batch_mm.cu",
    "csrc/glu.cu",
    "csrc/moe.cpp",
    "csrc/experts_gather.cu",
    "csrc/experts_backward.cu",
]

# Decode-path experts forward, one source for CUDA and ROCm (hipified by the builder).
[kernel.fused_experts]
language = "cpp-cuda"
depends = ["torch"]
src = ["csrc/fused_experts.cu"]

[kernel.fused_experts_rocm]
language = "cpp-rocm"
depends = ["torch"]
# wave64 (CDNA) only: the kernel assumes 64-wide wavefronts on AMD
rocm-archs = [
    "gfx90a",
    "gfx942",
    "gfx950",
]
src = ["csrc/fused_experts.cu"]
